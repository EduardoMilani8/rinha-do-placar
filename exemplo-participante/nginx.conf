# Poucos processos: o limite de CPU do balanceador é pequeno.
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    access_log off;

    upstream api {
        # "zone" compartilha o estado das instâncias entre os processos do nginx.
        zone api 64k;
        # Se uma instância falhar, fica fora de rotação por 30 s.
        server api01:8080 max_fails=1 fail_timeout=30s;
        server api02:8080 max_fails=1 fail_timeout=30s;
        keepalive 200;
    }

    server {
        listen 9999;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # Sem isso, o nginx espera muito tempo por uma instância que caiu
            # e a requisição estoura o limite de 2 s. Com estas linhas, ele
            # desiste em 0,3 s e tenta a outra instância.
            proxy_connect_timeout 300ms;
            proxy_next_upstream error timeout;
        }
    }
}
